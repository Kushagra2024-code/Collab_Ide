# ============================================================
# CollabIDE — Render Blueprint Specification
# ============================================================

services:
  # ── API Server Backend ───────────────────────────────────────
  - type: web
    name: collabide-backend
    env: node
    plan: free
    region: ohio
    buildCommand: pnpm install && BASE_PATH=/ VITE_BASE_PATH=/ pnpm --filter "@workspace/collab-ide..." run build && pnpm --filter "@workspace/api-server..." run build
    startCommand: pnpm --filter @workspace/api-server run start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: SESSION_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: collabide-db
          property: connectionString
      - key: GEMINI_API_KEY
        sync: false # Set your Gemini API key in the Render Dashboard

  # ── Static Web Frontend ───────────────────────────────────────
  - type: web
    name: collabide-frontend
    env: static
    buildCommand: pnpm install --frozen-lockfile && BASE_PATH=/ VITE_BASE_PATH=/ pnpm --filter "@workspace/collab-ide..." run build
    staticPublishPath: ./artifacts/collab-ide/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

databases:
  # ── PostgreSQL Database ───────────────────────────────────────
  - name: collabide-db
    plan: free
    region: ohio
    databaseName: collabide
    user: collabide
